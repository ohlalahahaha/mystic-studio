name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
  # Lets CodSpeed trigger backtest runs to build initial performance history.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC authentication with CodSpeed

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install dev dependencies (benchmarks only)
        run: npm ci
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: npx vitest bench --run
